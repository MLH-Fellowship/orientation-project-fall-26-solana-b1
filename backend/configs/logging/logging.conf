[loggers]
keys=root,app

[handlers]
keys=console

[formatters]
keys=standard

[logger_root]
level=WARNING
handlers=console

[logger_app]
level=INFO
handlers=console
qualname=app
propagate=0

[handler_console]
class=StreamHandler
level=NOTSET
formatter=standard
args=()

[formatter_standard]
format=%(asctime)s %(levelname)s %(name)s: %(message)s
