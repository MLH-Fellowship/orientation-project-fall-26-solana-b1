[loggers]
keys=root,app

[handlers]
keys=console,file

[formatters]
keys=standard

[logger_root]
level=WARNING
handlers=console

[logger_app]
level=INFO
handlers=console,file
qualname=app
propagate=0

[handler_console]
class=StreamHandler
level=NOTSET
formatter=standard
args=()

[handler_file]
class=FileHandler
level=NOTSET
formatter=standard
args=('logs/app.log', 'a', 'utf-8')

[formatter_standard]
format=%(asctime)s %(levelname)s %(name)s: %(message)s
